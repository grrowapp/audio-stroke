name: flutter-phone-ipa

on:
  workflow_dispatch:
  push:
    tags: ['phone-flutter-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Check tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/phone-flutter-v')
        run: |
          tag_version=${GITHUB_REF_NAME#phone-flutter-v}
          line=$(grep -E '^version:' apps/flutter-phone/pubspec.yaml | head -n1 | sed -E 's/^version:[[:space:]]*//; s/[[:space:]]+$//')
          pub_version=${line%%+*}
          if [ "$tag_version" != "$pub_version" ]; then
            echo "tag version ($tag_version) != pubspec version ($pub_version)" >&2
            exit 1
          fi
      - name: Build unsigned ipa
        run: apps/flutter-phone/tool/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AudioStrokePhone-ipa
          path: apps/flutter-phone/dist/*.ipa
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/phone-flutter-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AudioStrokePhone-ipa
          path: dist
      - name: Create release (or upload to existing) and attach ipa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.ipa --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.ipa --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Unsigned ipa for AltStore / SideStore. See docs/FLUTTER_PHONE.md."
          fi
